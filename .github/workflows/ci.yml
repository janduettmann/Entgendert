name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint:firefox
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run package
      - run: npm run release:verify
      - uses: actions/upload-artifact@v4
        with:
          name: entgendert-packages
          path: |
            artifacts/chrome/entgendert-*.zip
            artifacts/firefox/entgendert-*.zip
            artifacts/entgendert-*.zip
            artifacts/SHA256SUMS
            store/images/*.png
